org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

java_version=21

version=1.0.0
group=dev.bridge

mod_id=bridge
mod_name=Contract Bridge
mod_author=BigMer
license=MPL-2.0
description=Contract Bridge for Charta: a four-player duplicate board with a bidding box, a robot-filled table and full duplicate scoring.
mod_repo=https://github.com/BigDare819/charta-bridge

minecraft_version=1.21.1
# NOT "[1.21, 1.21.2)": Fabric's predicate parser has no maven-range support at all. It splits on
# whitespace, finds no operator prefix, then hands the whole bracketed string to VersionParser, which
# fails to parse it as semantic and falls back to StringVersion -- so the term becomes
# "version == \"[1.21,1.21.2)\"", which matches nothing. Verified against loader 0.19.5's
# VersionPredicateParser. Space-separated operators do work, and are ANDed.
minecraft_version_range=>=1.21 <1.21.2
# Charta is pinned below 1.3 on purpose: the addon mixins into Charta's screen and slot classes, so a
# minor bump there can move a target silently. A hard "incompatible" beats a crash inside a mixin.
charta_version_range=>=1.2.5 <1.3.0

parchment_minecraft=1.21.1
parchment_version=2024.11.17

fabric_version=0.116.7+1.21.1
fabric_loader_version=0.17.3

charta_version=1.2.5
